# Context factor analysis (paper §4.1, Fig. 4). Loaded by ContextFactorAnalysis.from_config().
# Facets placed in fewer than min_occurrences scenarios are skipped; a facet is 'mixed' when its top
# lift is less than dominance_ratio times the second. Before comparing contexts, environment spellings
# are case-normalized and raw MineXR task labels are merged with task_aliases (46 rules, the table
# used for Fig. 4). Matching ignores case and non-alphanumeric characters.
