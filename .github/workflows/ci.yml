name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[embed,dev]"
          python -m ipykernel install --user --name python3
      - name: Lint
        run: ruff check contextxr tests scripts --select E,F,W,B --ignore E501 --exclude contextxr/methods/_ranker
      - name: Validate dataset
        run: contextxr validate data/minexrpp
      - name: Unit tests
        run: pytest -q --ignore=tests/test_reproduce_paper.py --ignore=tests/test_notebooks.py
      - name: Reproduce the paper (from cache, no API key)
        run: pytest -q tests/test_reproduce_paper.py
      - name: Example notebooks
        run: pytest -q --nbmake examples/
